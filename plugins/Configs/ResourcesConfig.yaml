  # 0x0009000f
  - ResType: "0x09"
    ResID: "0x000f"
    Name: "RES_CGRP_IO_WEIGHT"
    Path: "/sys/fs/cgroup/%s/io.bfq.weight"
    Supported: true
    Permissions: "system"
    Modes: ["display_on"]
    Policy: "instant_apply"
    ApplyType: "cgroup"

  # Reserve "80" for RT Benchmarking(cyclictest)
