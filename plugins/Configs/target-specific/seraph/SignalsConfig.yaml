  # MPCTLV3_ALL_CPUS_PWR_CLPS_DIS, 0x1
  # MPCTLV3_SCHED_BOOST, 0x1
  # MPCTLV3_MAX_FREQ_CLUSTER_BIG_CORE_0, 2.035 Ghz
  # MPCTLV3_MIN_FREQ_CLUSTER_BIG_CORE_0, 2.035 Ghz
  # MPCTLV3_MAX_FREQ_CLUSTER_LITTLE_CORE_0, 1.997 Ghz
  # MPCTLV3_MIN_FREQ_CLUSTER_LITTLE_CORE_0, 1.997 Ghz
  # CPU-LLC-DDR BWMON - Set min_freq 1555
  - SigId: "0x1338"
    Category: "0xea"
    SigType: 0
    Name: "URM_SIG_CAMERA_CloseCamera"
    Enable: true
    Permissions: ["third_party", "system"]
    Timeout: -1
    Resources:
      - {ResCode: "0x00010000", Values: [1]}          # 0x40400000 RES_PM_QOS_CPU_DMA_LATENCY (ALL_CPUS_PWR_CLPS_DIS)
      - {ResCode: "0x00030000", Values: [1]}          # 0x40C00000 RES_SCHED_BOOST_V2 (SCHED_BOOST)
      - {ResCode: "RES_SCALE_MAX_FREQ", ResInfo: "CLUSTER_BIG_ALL_CORES", Values: [2035000]}  # 0x40804000 RES_MSM_PERF_CPU_MAX_FREQ (cluster1=2035MHz)
      - {ResCode: "RES_SCALE_MIN_FREQ", ResInfo: "CLUSTER_BIG_ALL_CORES", Values: [2035000]}  # 0x40800000 RES_MSM_PERF_CPU_MIN_FREQ (cluster1=2035MHz)
      - {ResCode: "RES_SCALE_MAX_FREQ", ResInfo: "CLUSTER_LITTLE_ALL_CORES", Values: [1997000]}     # 0x40804100 RES_MSM_PERF_CPU_MAX_FREQ (cluster0=1997MHz)
      - {ResCode: "RES_SCALE_MIN_FREQ", ResInfo: "CLUSTER_LITTLE_ALL_CORES", Values: [1997000]}     # 0x40800100 RES_MSM_PERF_CPU_MIN_FREQ (cluster0=1997MHz)
      - {ResCode: "0x000c000f", Values: [1555000]}    # 0x4303C000 RES_MPCTLV3_LLCC_DDR_BW_MIN_FREQ_V2

  # Id: 0x00001339
  # camera snapshot tunings
  # MPCTLV3_ALL_CPUS_PWR_CLPS_DIS, 0x1
  # Cluster min freq to 1.113 GHz
  - SigId: "0x1339"
