      - {ResCode: "RES_SCALE_MIN_FREQ", ResInfo: "CLUSTER_LITTLE_ALL_CORES", Values: [1113000]}  # 0x40800000 RES_MSM_PERF_CPU_MIN_FREQ (cluster0=1113MHz)

  # Id: 0x00001406
  # 3k30 - 3k camera 30fps
  # CPU-LLC BWMON - Set sample_ms 33
  # CPU-LLC BWMON - Set io_percent 100
  # CPU-LLC BWMON - Set hyst_length hist memory 0
  # CPU-LLC BWMON - Set max freq 933mhz
  # CPU-LLC-DDR BWMON - Set sample_ms 33
  # CPU-LLC-DDR BWMON - Set io_percent 100
  # CPU-LLC-DDR BWMON - Set hyst_length hist memory 0
  # CPU-LLC-DDR BWMON - Set min_freq 1555
  # CPU - Disable schedutil PL
  # CPU - Set hispeed load 99
  # AB_SCALE - 50
  - SigId: "0x1406"
    Category: "0xea"
    SigType: 0
    Name: "URM_SIG_CAMERA_VideoEncode3k"
    Enable: true
    Permissions: ["third_party", "system"]
    Timeout: -1
    Resources:
      - {ResCode: "0x0006000f", Values: [33]}      # 0x4183C000 MPCTLV3_CPU_LLCC_BW_SAMPLE_MS
      - {ResCode: "0x0006000d", Values: [100]}     # 0x41834000 MPCTLV3_CPU_LLCC_BW_IO_PERCENT
      - {ResCode: "0x0006000e", Values: [0]}       # 0x41838000 MPCTLV3_CPU_LLCC_BW_HYST_OPT
      - {ResCode: "0x00060012", Values: [933000]}  # 0x41848000 MPCTLV3_CPU_LLCC_BW_MAX_FREQ_V2
      - {ResCode: "0x000c000d", Values: [33]}      # 0x43034000 MPCTLV3_LLCC_DDR_BW_SAMPLE_MS
      - {ResCode: "0x008a0005", Values: [100]}     # 0x43020000 MPCTLV3_LLCC_DDR_BW_IO_PERCENT
      - {ResCode: "0x000c0003", Values: [0]}       # 0x43024000 MPCTLV3_LLCC_DDR_BW_HYST_OPT
      - {ResCode: "0x000c000f", Values: [1555000]} # 0x4303C000 RES_MPCTLV3_LLCC_DDR_BW_MIN_FREQ_V2
      - {ResCode: "0x000c0012", Values: [50]}      # 0x43048000 RES_LLCC_DDR_BWMON_AB_SCALE_V2
#      - {ResCode: "0x00050011", Values: [0]}       # 0x41444000 RES_SCHEDUTIL_PL_CLUSTER_BIG
#      - {ResCode: "0x00050010", Values: [99]}      # 0x41440000 RES_SCHEDUTIL_HISPEED_LOAD_CLUSTER_BIG

  # Id: 0x00001407
  # camera wakelock
  # CAMERA_HAL_RBSC_SYNC_WL, 0
  - SigId: "0x1407"
