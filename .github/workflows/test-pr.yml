name: Test PR build

run-name: "Tests triggered by PR: ${{ github.event.workflow_run.display_title }}"

on:
  # This workflow intentionally runs in the base repository context so LAVA
  # secrets are only available after the untrusted PR build has completed.
  # It does not checkout or execute PR-controlled code on GitHub runners; it
  # only consumes pinned workflows/actions and artifacts produced by the base
  # Build URM workflow.
  workflow_run: # zizmor: ignore[dangerous-triggers]
    workflows: ["Build URM"]
    types:
      - completed

concurrency:
  group: test-pr-${{ github.event.workflow_run.head_repository.full_name }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  determine-target-branch:
    runs-on: ubuntu-latest
    if: github.event.workflow_run.event == 'pull_request'
    permissions:
      contents: read
      actions: read
    outputs:
      branch: ${{ steps.branch.outputs.value }}
      pr_number: ${{ steps.branch.outputs.pr_number }}
      pr_url: ${{ steps.branch.outputs.pr_url }}
    steps:
      - name: Download event file
        uses: actions/download-artifact@v7
        with:
          name: Event File
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - id: branch
        run: |
          BRANCH="$(jq -r '.pull_request.base.ref // "main"' event.json)"
          echo "::notice title=Target branch::Resolved target branch: ${BRANCH}"
          echo "value=${BRANCH}" >> "$GITHUB_OUTPUT"
          PR_NUMBER="$(jq -r '.number // .pull_request.number // ""' event.json)"
          PR_URL="$(jq -r '.pull_request.html_url // ""' event.json)"
          echo "::notice title=Pull request::PR #${PR_NUMBER} (${PR_URL})"
          echo "pr_number=${PR_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "pr_url=${PR_URL}" >> "$GITHUB_OUTPUT"

  create-lava-status:
    name: "Create LAVA PR status"
    needs: determine-target-branch
    if: needs.determine-target-branch.outputs.branch == 'main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: write
    steps:
      - name: Create pending status
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          WORKFLOW_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail

          gh api "repos/${GH_REPO}/statuses/${HEAD_SHA}" \
            --method POST \
            --field state="pending" \
            --field context="userspace-resource-manager_tests" \
            --field description="LAVA validation is running" \
            --field target_url="${WORKFLOW_URL}"

  test:
    needs: [determine-target-branch, create-lava-status]
    if: github.event.workflow_run.conclusion == 'success' && needs.determine-target-branch.outputs.branch == 'main'
    permissions:
      contents: read
      actions: read
      checks: write
      pull-requests: write
    uses: ./.github/workflows/test.yml
    secrets:
      LAVATOKEN: ${{ secrets.LAVATOKEN }}
    with:
      build_id: ${{ github.event.workflow_run.id }}
      pr_number: ${{ needs.determine-target-branch.outputs.pr_number }}
      pr_url: ${{ needs.determine-target-branch.outputs.pr_url }}

  finish-lava-status:
    name: "Finish LAVA PR status"
    needs: [determine-target-branch, create-lava-status, test]
    if: always() && needs.create-lava-status.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: write
    steps:
      - name: Update status conclusion
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          BUILD_RESULT: ${{ github.event.workflow_run.conclusion }}
          TEST_RESULT: ${{ needs.test.result }}
          LAVA_RESULT: ${{ needs.test.outputs.result_state }}
          LAVA_DESCRIPTION: ${{ needs.test.outputs.result_description }}
          WORKFLOW_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail

          STATE="failure"
          TITLE="LAVA validation failed"
          DESCRIPTION="LAVA validation failed"

          if [ "${BUILD_RESULT}" != "success" ]; then
            TITLE="LAVA validation was not run"
            DESCRIPTION="Build URM completed with '${BUILD_RESULT}'"
          elif [ "${LAVA_RESULT}" = "success" ]; then
            STATE="success"
            TITLE="LAVA validation passed"
            DESCRIPTION="${LAVA_DESCRIPTION}"
          elif [ "${LAVA_RESULT}" = "failure" ]; then
            TITLE="LAVA validation failed"
            DESCRIPTION="${LAVA_DESCRIPTION}"
          elif [ "${TEST_RESULT}" = "cancelled" ]; then
            STATE="error"
            TITLE="LAVA validation was cancelled"
            DESCRIPTION="LAVA validation was cancelled"
          elif [ "${TEST_RESULT}" = "skipped" ]; then
            TITLE="LAVA validation was skipped"
            DESCRIPTION="LAVA validation was skipped"
          fi

          gh api "repos/${GH_REPO}/statuses/${HEAD_SHA}" \
            --method POST \
            --field state="${STATE}" \
            --field context="userspace-resource-manager_tests" \
            --field description="${DESCRIPTION}" \
            --field target_url="${WORKFLOW_URL}"

          echo "${TITLE}"

  comment-on-pr:
    name: "Comment on PR"
    needs: [test, finish-lava-status]
    if: always() && needs.test.result != 'skipped'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      pull-requests: write
    steps:
      - name: Download Result Summary
        if: needs.test.outputs.summary_ids != ''
        uses: actions/download-artifact@v7
        with:
          artifact-ids: ${{ needs.test.outputs.summary_ids }}
          path: results_summary

      - name: Download event file
        uses: actions/download-artifact@v7
        with:
          name: Event File
          run-id: ${{ github.event.workflow_run.id }}
          path: artifacts
          github-token: ${{ github.token }}

      - name: Prepare PR comment
        id: pr_comment_prep
        env:
          GH_EVENT_WORKFLOW_RUN_HEAD_SHA: "${{ github.event.workflow_run.head_sha }}"
          TEST_RESULT: "${{ needs.test.result }}"
          LAVA_RESULT: "${{ needs.test.outputs.result_state }}"
          LAVA_DESCRIPTION: "${{ needs.test.outputs.result_description }}"
          LAVA_PASS_COUNT: "${{ needs.test.outputs.result_pass_count }}"
          LAVA_FAIL_COUNT: "${{ needs.test.outputs.result_fail_count }}"
          LAVA_TOTAL_COUNT: "${{ needs.test.outputs.result_total_count }}"
          LAVA_EXPECTED_COUNT: "${{ needs.test.outputs.result_expected_count }}"
          LAVA_MISSING_COUNT: "${{ needs.test.outputs.result_missing_count }}"
        run: |
          echo "## Test run [workflow](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})" > pr-comment.txt
          echo "## Test jobs for commit ${GH_EVENT_WORKFLOW_RUN_HEAD_SHA}" >> pr-comment.txt
          echo "" >> pr-comment.txt
          echo "| Workflow | LAVA | Required | Completed | Passed | Failed | Missing/running |" >> pr-comment.txt
          echo "| --- | --- | ---: | ---: | ---: | ---: | ---: |" >> pr-comment.txt
          echo "| ${TEST_RESULT} | ${LAVA_RESULT:-unavailable} | ${LAVA_EXPECTED_COUNT:-0} | ${LAVA_TOTAL_COUNT:-0} | ${LAVA_PASS_COUNT:-0} | ${LAVA_FAIL_COUNT:-0} | ${LAVA_MISSING_COUNT:-0} |" >> pr-comment.txt
          echo "" >> pr-comment.txt
          if [ -d ./results_summary ]; then
            python3 - <<'PY' >> pr-comment.txt
          import re
          from pathlib import Path

          def clean_cell(cell):
              return cell.strip().replace("<sub>", "").replace("</sub>", "")

          summary_file = next(Path("results_summary").rglob("userspace-resource-manager-test_job_summary"), None)
          if summary_file is None:
              raise SystemExit(0)

          text = summary_file.read_text(encoding="utf-8")
          lines = text.splitlines()
          devices = []
          result_by_device = {}
          jobs_by_device = {}

          for idx, line in enumerate(lines):
              cells = [clean_cell(c) for c in line.strip().strip("|").split("|")]
              if len(cells) > 1 and cells[0] == "Test":
                  devices = cells[1:]
                  for row in lines[idx + 1:]:
                      row_cells = [clean_cell(c) for c in row.strip().strip("|").split("|")]
                      if not row_cells or row_cells[0] == "----":
                          continue
                      if row_cells[0] != "userspace-resource-manager":
                          break
                      for device, cell in zip(devices, row_cells[1:]):
                          value = cell.lower()
                          if "white_check_mark" in value or "[pass]" in value:
                              result_by_device[device] = "PASS"
                          elif ":x:" in value or "[fail]" in value:
                              result_by_device[device] = "FAIL"
                          elif "warning" in value or "[skip]" in value:
                              result_by_device[device] = "SKIP"
                          else:
                              result_by_device[device] = "MISSING/RUNNING"
                      break
                  break

          for line in lines:
              cells = [clean_cell(c) for c in line.strip().strip("|").split("|")]
              if len(cells) != 4 or cells[0] in ("Job ID", "----"):
                  continue
              job, device, state, health = cells
              if re.search(r"\[\d+\]\(", job):
                  jobs_by_device[device] = (job, state, health)

          if devices:
              print("### Required LAVA results by device")
              print("")
              print("| Device | Result | Job | State | Health |")
              print("| --- | --- | --- | --- | --- |")
              for device in devices:
                  job, state, health = jobs_by_device.get(device, ("", "", ""))
                  print(f"| {device} | {result_by_device.get(device, 'UNKNOWN')} | {job} | {state} | {health} |")
              print("")
          PY
          fi
          PR_NUMBER="$(jq -r ".number" "artifacts/event.json")"
          if [ -d ./results_summary ]; then
            while IFS= read -r RESULT_FILE_NAME; do
              grep "summary" "${RESULT_FILE_NAME}" | grep -v "All jobs summary" >> pr-comment.txt || true
            done < <(find ./results_summary/ -type f)
          else
            echo "" >> pr-comment.txt
            echo "No LAVA summary artifact was available. Check the linked workflow for the failure details." >> pr-comment.txt
          fi
          echo "pr_number=${PR_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Comment on PR
        uses: thollander/actions-comment-pull-request@24bffb9b452ba05a4f3f77933840a6a841d1b32b # v3
        with:
          file-path: pr-comment.txt
          pr-number: ${{ steps.pr_comment_prep.outputs.pr_number }}
          comment-tag: test-results
